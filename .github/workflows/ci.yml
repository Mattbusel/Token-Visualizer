name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Tests
        run: python -m pytest -v tests
      - name: Run the installed command and the legacy script name
        shell: bash
        run: |
          token-visualizer --version
          printf 'hello world' | token-visualizer -m gpt-4 | grep -q "Total tokens: 2"
          printf 'hello world' | python "Token Visualizer.py" -m gpt-4 | grep -q "Total tokens: 2"
