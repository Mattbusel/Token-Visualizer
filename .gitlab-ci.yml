# Release pipeline: on a v* tag, build a single-file Linux x86_64 program with PyInstaller
# (tiktoken encodings bundled, so it runs offline), smoke-test it, upload it to this
# project's generic package registry and publish a GitLab release.
# Built on Debian bullseye (glibc 2.31) so it runs on Ubuntu 20.04+ and Debian 11+.
#
# Stable download links (always the newest release):
#   https://gitlab.com/<project>/-/releases/permalink/latest/downloads/<BIN>-linux-x86_64.tar.gz

variables:
  BIN: "token-visualizer"
  PYI: "--onefile --console --name token-visualizer --paths . --add-data tiktoken_cache:tiktoken_cache --hidden-import tiktoken_ext --hidden-import tiktoken_ext.openai_public --exclude-module transformers --exclude-module torch token_visualizer.py"              # PyInstaller arguments
  SMOKE: "printf hello_world | HTTPS_PROXY=http://127.0.0.1:9 ./dist/token-visualizer -m gpt-4"          # command run against dist/$BIN as a test
  PKG: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${BIN}/${CI_COMMIT_TAG}"

stages: [build, release]

build-linux:
  stage: build
  image: python:3.12-bullseye
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
  script:
    - python -m pip install --quiet . "pyinstaller>=6.10"
    - TIKTOKEN_CACHE_DIR="$PWD/tiktoken_cache" python -c "import tiktoken; [tiktoken.get_encoding(n) for n in ('cl100k_base', 'o200k_base', 'p50k_base', 'r50k_base')]"
    - python -m PyInstaller --noconfirm $PYI
    - ./dist/$BIN --version
    - sh -c "$SMOKE"
    - name="$BIN-$CI_COMMIT_TAG-x86_64-unknown-linux-gnu"
    - mkdir -p "out/$name"
    - cp "dist/$BIN" README.md LICENSE "out/$name/"
    - cd out
    - tar czf "$name.tar.gz" "$name"
    - cp "$name.tar.gz" "$BIN-linux-x86_64.tar.gz"
    - rm -rf "$name"
    - sha256sum *.tar.gz > SHA256SUMS.txt
    - cat SHA256SUMS.txt
    - 'for f in *; do curl --fail -sS -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$PKG/$f" >/dev/null; echo "uploaded $f"; done'
  artifacts:
    paths: [out/]

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "$BIN $CI_COMMIT_TAG"
    description: "Linux x86_64 build of $BIN $CI_COMMIT_TAG (glibc 2.31+: Ubuntu 20.04, Debian 11 and newer). A single file with everything bundled, no Python needed: download, `tar xzf`, run. Checksums in SHA256SUMS.txt."
    assets:
      links:
        - name: "Linux x86_64 (tar.gz)"
          url: "${PKG}/${BIN}-linux-x86_64.tar.gz"
          link_type: package
          direct_asset_path: "/${BIN}-linux-x86_64.tar.gz"
        - name: "SHA256SUMS.txt"
          url: "${PKG}/SHA256SUMS.txt"
          link_type: other
          direct_asset_path: "/SHA256SUMS.txt"
